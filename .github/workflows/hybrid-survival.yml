name: Hybrid SurvivalWorld Pulse Integration
on:
  push:
    branches: [feature/v09-hybrid-survival-pulse]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mixed-population:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build integrated cognitive and survival engine
        run: dotnet build benchmarks/Enorys.HybridSurvival/Enorys.HybridSurvival.csproj -c Release
      - name: Test exact clock parity, private wakeups, memory and emotion graph
        run: dotnet run --project benchmarks/Enorys.HybridSurvival -c Release --no-build -- test
      - name: Benchmark 500 active and 5000 background NPC
        run: dotnet run --project benchmarks/Enorys.HybridSurvival -c Release --no-build -- bench
      - name: Recheck existing C# integration
        run: dotnet run --project tests/Enorys.Integration -c Release -- test
