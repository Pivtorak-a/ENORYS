name: ENORYS Core (.NET 10)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Enorys.Smoke/Enorys.Smoke.csproj --configuration Release
      - run: dotnet run --project tests/Enorys.Smoke/Enorys.Smoke.csproj --configuration Release --no-build
